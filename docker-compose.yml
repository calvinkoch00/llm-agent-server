version: '3.8'

services:
  api:
    build: .
    container_name: llm_server
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    environment:
      - LLM_API_KEY=${LLM_AGENT_API_KEY}
    depends_on:
      - ollama
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # This is the sidecar container that auto-downloads the models
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama_model_puller
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      sh -c "sleep 10 && ollama pull llama3.2 && ollama pull qwen2.5:32b"

volumes:
  ollama_data:
version: '3.8'

services:
  api:
    build: .
    container_name: llm_server
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    environment:
      - LLM_API_KEY=${LLM_AGENT_API_KEY}
    depends_on:
      - ollama
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # This is the sidecar container that auto-downloads the models
  ollama_model_puller:
    image: ollama/ollama
    container_name: ollama_model_puller
    entrypoint: /bin/sh
    command: -c "sleep 10 && OLLAMA_HOST=ollama:11434 ollama pull llama3.2 && OLLAMA_HOST=ollama:11434 ollama pull qwen2.5:32b"
    depends_on:
      - ollama

volumes:
  ollama_data: